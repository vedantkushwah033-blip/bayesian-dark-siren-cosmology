name: GP Pilot

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/gp_reconstruction.py"
      - "run_gp_pilot.py"
      - "tests/test_gp_reconstruction.py"
      - ".github/workflows/gp_pilot.yml"
      - "requirements.txt"

jobs:
  gp-pilot:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_gp_reconstruction.py
      - run: python run_gp_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: gp-pilot-results
          path: |
            results/gp_pilot.csv
            results/gp_pilot_summary.csv
