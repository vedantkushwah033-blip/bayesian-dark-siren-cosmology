name: Calibration Curve

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/bayesian_inference.py"
      - "src/simulations_v2.py"
      - "run_calibration_curve.py"
      - "requirements.txt"
      - ".github/workflows/calibration_curve.yml"

jobs:
  calibration-curve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        # The workflow intentionally follows the repository requirements file; package versions are not pinned yet.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run calibration curve
        run: |
          mkdir -p calibration_curve_output
          python run_calibration_curve.py | tee calibration_curve_output/calibration_curve.txt

      - name: Upload calibration curve
        uses: actions/upload-artifact@v4
        with:
          name: calibration-curve
          path: |
            results/calibration_curve.csv
            calibration_curve_output/calibration_curve.txt
