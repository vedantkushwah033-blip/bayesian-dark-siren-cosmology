name: Full Experiment Matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  full-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full experiment matrix
        run: |
          mkdir -p results
          python run_experiment_matrix.py

      - name: Analyze matrix
        run: |
          python analyze_results.py

      - name: Generate publication figures
        run: |
          python make_figures.py

      - name: Upload experiment results and figures
        uses: actions/upload-artifact@v4
        with:
          name: full-experiment-matrix
          path: |
            results/experiment_matrix.csv
            results/summary_matrix.csv
            results/figures/
