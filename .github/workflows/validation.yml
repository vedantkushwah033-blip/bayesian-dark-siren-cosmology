name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test-and-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Run 100-run complete-catalogue baseline
        run: |
          mkdir -p validation_output
          python run_validation.py | tee validation_output/baseline_summary.txt

      - name: Run 1000-run complete-catalogue calibration
        run: |
          mkdir -p calibration_output
          python run_calibration.py | tee calibration_output/calibration_summary.txt

      - name: Run known-host baseline diagnostic
        run: |
          mkdir -p diagnostics_output
          python run_baseline_diagnostics.py | tee diagnostics_output/known_host_summary.txt

      - name: Upload diagnostic summary
        uses: actions/upload-artifact@v4
        with:
          name: baseline-diagnostics
          path: diagnostics_output/known_host_summary.txt

      - name: Upload calibration summary
        uses: actions/upload-artifact@v4
        with:
          name: baseline-calibration
          path: calibration_output/calibration_summary.txt

      - name: Upload validation summary
        uses: actions/upload-artifact@v4
        with:
          name: baseline-validation
          path: validation_output/baseline_summary.txt
